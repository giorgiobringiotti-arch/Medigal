name: Import Medigal static site

on:
  push:
    branches: [main]
    paths:
      - 'medigal-sito-statico.zip'
      - '.github/workflows/import-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded static site
        shell: bash
        run: |
          set -euo pipefail
          ZIP="medigal-sito-statico.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP not present yet: waiting for upload."
            exit 0
          fi

          rm -rf _site
          mkdir _site
          set +e
          unzip -o "$ZIP" -d _site
          UNZIP_CODE=$?
          set -e
          if [ "$UNZIP_CODE" -gt 1 ]; then
            echo "Unzip failed with code $UNZIP_CODE"
            exit "$UNZIP_CODE"
          fi

          test -f _site/index.html
          test -f _site/assets/index-BVRBnQOF.js
          test -f _site/assets/index-DuoqGBxm.css

          rm -rf assets
          cp -a _site/. .
          rm -rf _site
          rm -f "$ZIP" IMPORT_STATUS.txt

          cat > vercel.json <<'EOF'
          {
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          EOF

      - name: Commit complete site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import complete Medigal static site"
          git push
