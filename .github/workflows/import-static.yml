name: Import Medigal static site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror current Medigal static build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          import re

          BASE = "https://www.medigal.it/"
          UA = "Mozilla/5.0 (compatible; MedigalStaticImport/1.0)"

          def fetch(url):
              req = Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urlopen(req, timeout=45) as r:
                  return r.read()

          def save(rel, data):
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print(f"saved {rel} ({len(data)} bytes)")

          html = fetch(BASE)
          save("index.html", html)

          text = html.decode("utf-8", "ignore")
          pattern = re.compile(r"(?:\./|/)?assets/[A-Za-z0-9._-]+")
          queue = []
          seen = set()

          def add_refs(s):
              for ref in pattern.findall(s):
                  rel = ref.lstrip("./")
                  if rel not in seen and rel not in queue:
                      queue.append(rel)

          add_refs(text)

          while queue:
              rel = queue.pop(0)
              if rel in seen:
                  continue
              seen.add(rel)
              data = fetch(urljoin(BASE, rel))
              save(rel, data)
              if rel.endswith((".js", ".css", ".html")):
                  add_refs(data.decode("utf-8", "ignore"))

          for rel in ("robots.txt", "favicon.ico", "favicon.png", "placeholder.svg"):
              try:
                  save(rel, fetch(urljoin(BASE, rel)))
              except Exception as e:
                  print(f"optional {rel} skipped: {e}")

          if not any(Path("assets").glob("*.js")):
              raise SystemExit("No JavaScript bundle downloaded")
          if not any(Path("assets").glob("*.css")):
              raise SystemExit("No CSS bundle downloaded")
          PY

          cat > .htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

          cat > vercel.json <<'EOF'
          {
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          EOF

      - name: Commit imported site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import complete Medigal static site"
          git push
