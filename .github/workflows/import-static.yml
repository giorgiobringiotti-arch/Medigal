name: Import Medigal static site

on:
  push:
    branches: [main]
    paths:
      - 'upload_parts/**'
      - '.github/workflows/import-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and extract uploaded site
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(upload_parts/part*.b64)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No upload parts present."
            exit 0
          fi

          ZIP="medigal-sito-statico.zip"
          : > "$ZIP"
          for f in "${parts[@]}"; do
            echo "Decoding $f"
            base64 -d "$f" >> "$ZIP"
          done

          unzip -t "$ZIP" >/dev/null
          rm -rf _site
          mkdir _site
          unzip -oq "$ZIP" -d _site

          test -f _site/index.html
          test -f _site/assets/index-BVRBnQOF.js
          test -f _site/assets/index-DuoqGBxm.css

          rm -rf assets
          cp -a _site/. .
          rm -rf _site upload_parts
          rm -f "$ZIP" IMPORT_STATUS.txt

          cat > vercel.json <<'EOF'
          {
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          EOF

      - name: Commit complete site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import complete Medigal static site"
          git push
